<title>LA POSTE PRO · Autorité générative et plan d’actions</title>

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600;700&display=swap" rel="stylesheet">
<style>


:root{
  --indigo:#241B4B; --indigo-2:#3A2A75; --violet:#6E3AA8; --framboise:#E0567B;
  --cyan:#1D9FB8; --ambre:#C77924; --vert:#2C7E60; --rouge:#C93B36;
  --ink:#14121F; --ink-2:#4A4762; --muted:#7E7C93;
  --bg:#F4F4F8; --card:#FFF; --line:#E6E4EF;
  --lav:#F1EDFA; --warm:#FFF5F0; --nuit:#191533;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --sans:"IBM Plex Sans",-apple-system,Segoe UI,sans-serif;
  --disp:"Bricolage Grotesque","IBM Plex Sans",sans-serif;
  --r:16px; --sh:0 1px 2px rgba(20,18,31,.05),0 10px 28px rgba(20,18,31,.06);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:700;letter-spacing:-.02em}
p{margin:0}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.wrap{max-width:1340px;margin:0 auto;padding:0 20px}

/* HEADER + BARRE */
.hd{background:linear-gradient(112deg,var(--indigo),var(--violet) 55%,var(--framboise) 125%);color:#fff;position:relative;overflow:hidden}
.hd::after{content:"";position:absolute;right:-80px;top:-160px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.15),transparent 62%)}
.hd .wrap{padding:18px 20px 20px;position:relative;z-index:2}
.hd-row{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.hd-mark{font-family:var(--mono);font-size:10px;letter-spacing:.24em;text-transform:uppercase;background:rgba(255,255,255,.16);padding:6px 12px;border-radius:100px}
.hd h1{font-size:clamp(21px,2.6vw,30px);margin-top:14px;letter-spacing:-.035em}
.hd .sub{color:rgba(255,255,255,.76);margin-top:7px;font-size:14.5px;max-width:66ch}
.btn-pdf{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;background:#fff;color:var(--indigo);border:0;padding:9px 15px;border-radius:100px;cursor:pointer;font-weight:600}
.sticky{position:sticky;top:0;z-index:40;background:var(--indigo);box-shadow:0 6px 22px rgba(20,18,31,.22)}
.sticky-in{max-width:1340px;margin:0 auto;padding:0 20px;display:flex;align-items:stretch;gap:20px;flex-wrap:wrap}
.hscore{display:flex;align-items:center;gap:16px;padding:12px 20px 12px 0;flex:none}
.hscore .t{font-family:var(--disp);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;color:#fff;line-height:1.1}
.hscore .d{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#A79FD4;margin-top:5px}
.hscore .big{font-family:var(--disp);font-size:46px;font-weight:800;letter-spacing:-.05em;color:#fff;line-height:.9}
.hscore .big i{font-style:normal;font-size:15px;color:#A79FD4;font-weight:600}
.hpal{background:var(--framboise);color:#fff;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:100px;display:inline-block;margin-top:6px}
.hsep{width:1px;background:rgba(255,255,255,.16);margin:12px 0}
.nav{display:flex;gap:5px;overflow-x:auto;flex:1}
.tab{background:transparent;border:0;color:rgba(255,255,255,.6);font-family:var(--sans);font-size:13.5px;font-weight:600;padding:0 15px;cursor:pointer;position:relative;white-space:nowrap;display:flex;flex-direction:column;justify-content:center;gap:3px;min-height:74px;text-align:left;border-radius:10px}
.tab .n{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:rgba(255,255,255,.4)}
.tab:hover{background:rgba(255,255,255,.07);color:#fff}
.tab[aria-selected="true"]{background:rgba(255,255,255,.13);color:#fff}
.tab[aria-selected="true"] .n{color:var(--framboise)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:3px;background:var(--framboise);border-radius:3px 3px 0 0}

/* PANELS */
.panel{display:none;padding:30px 0 70px;animation:vin .3s ease both}
.panel.on{display:block}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel.terr{background:var(--lav)}
.panel.pers{background:var(--warm)}
.panel.sig{background:var(--nuit);color:#EDEBF7}
.panel.sig .lbl{color:#8B85B5}
.zone{margin-top:16px}
.zhead{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap;margin-bottom:16px}
.zhead h2{font-size:clamp(19px,2.2vw,26px)}
.zhead .desc{color:var(--ink-2);max-width:66ch;margin-top:6px}
.panel.sig .zhead .desc{color:#A9A4C7}
.zhead .lbl{margin-left:auto}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px}

/* FILTRE MOTEUR */
.engines{display:flex;gap:5px;padding:5px;background:#fff;border-radius:14px;box-shadow:var(--sh);overflow-x:auto}
.engines button{border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px}
.engines button:hover{background:var(--lav);color:var(--violet)}
.engines button[aria-pressed="true"]{background:var(--indigo);color:#fff}
.engines button i{font-style:normal;font-family:var(--mono);font-size:9.5px;opacity:.6}

/* HERO */
.hero{display:grid;grid-template-columns:minmax(300px,1.15fr) 1fr;gap:14px}
.score-card{background:linear-gradient(150deg,var(--indigo),var(--indigo-2) 60%,#5A2E86);color:#fff;border-radius:var(--r);padding:26px;position:relative;overflow:hidden;display:grid;grid-template-columns:1fr 180px;gap:20px;align-items:center}
.score-card::before{content:"";position:absolute;inset:auto -60px -80px auto;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(224,86,123,.35),transparent 65%)}
.score-card .ttl{font-family:var(--disp);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.score-card .date{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#A79FD4;margin-top:6px}
.score-card .why{margin-top:14px;font-size:13px;color:rgba(255,255,255,.72);position:relative;z-index:2;max-width:34ch}
.gauge{position:relative;width:180px;height:180px}
.gauge svg{transform:rotate(-90deg)}
.gauge .gv{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.gauge .gn{font-family:var(--disp);font-size:66px;font-weight:800;letter-spacing:-.06em;line-height:.88}
.gauge .gd{font-family:var(--mono);font-size:11px;color:#A79FD4;margin-top:3px}
.ladder{margin-top:18px;position:relative;z-index:2}
.lrow{display:grid;grid-template-columns:20px 1fr auto;gap:11px;align-items:center;padding:7px 0}
.lrow+.lrow{border-top:1px solid rgba(255,255,255,.1)}
.lrow .dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}
.lrow .nm{font-size:13.5px;font-weight:600;color:rgba(255,255,255,.5)}
.lrow .st{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.lrow.cur .dot{background:var(--framboise);border-color:var(--framboise)}
.lrow.cur .nm{color:#fff}.lrow.cur .st{color:var(--framboise)}
.lrow.next .dot{border-color:#fff;border-style:dashed}
.lrow.next .nm{color:rgba(255,255,255,.9)}.lrow.next .st{color:#fff}

/* DÉCISION */
.decision{background:var(--framboise);color:#fff;border-radius:var(--r);padding:26px 26px 84px;position:relative;overflow:hidden}
.decision .idx{position:absolute;top:2px;right:16px;font-family:var(--disp);font-size:104px;font-weight:800;color:rgba(255,255,255,.13);letter-spacing:-.08em;line-height:1}
.decision h3{font-size:26px;line-height:1.1;margin-top:34px;max-width:20ch;position:relative}
.decision p{margin-top:14px;color:rgba(255,255,255,.85);font-size:14px;position:relative;max-width:38ch}
.decision p b{color:#fff}
.decision button{position:absolute;left:26px;right:26px;bottom:24px;display:flex;justify-content:space-between;align-items:center;background:transparent;border:0;border-top:1px solid rgba(255,255,255,.3);padding:16px 0 0;color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;font-family:var(--sans)}
.decision button:hover{opacity:.85}

/* KPI */
.kpi{position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--violet)}
.kpi.neg::after{background:var(--rouge)}.kpi.pos::after{background:var(--vert)}.kpi.amb::after{background:var(--ambre)}
.kpi .lbl{display:block;padding-right:48px}
.kpi .v{font-family:var(--disp);font-size:58px;font-weight:800;letter-spacing:-.05em;line-height:.95;margin-top:10px}
.kpi .v small{font-size:23px;font-weight:700;color:var(--muted);margin-left:2px}
.kpi.neg .v{color:var(--rouge)}.kpi.pos .v{color:var(--vert)}.kpi.amb .v{color:var(--ambre)}
.kpi .c{margin-top:8px;font-size:13.5px;color:var(--ink-2)}
.kpi .c b{font-weight:600;color:var(--ink)}
.readbar{margin-top:14px}
.readbar .track{height:11px;background:var(--line);border-radius:7px;position:relative}
.readbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--violet);width:0;transition:width .9s cubic-bezier(.2,.8,.3,1)}
.kpi.neg .readbar .fill{background:var(--rouge)}.kpi.pos .readbar .fill{background:var(--vert)}.kpi.amb .readbar .fill{background:var(--ambre)}
.readbar .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);border-radius:2px;transition:left .6s ease}
.readbar .rl{display:flex;justify-content:space-between;margin-top:7px;gap:10px}
.readbar .rl span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.readbar .rl b{color:var(--ink);font-weight:600}

/* + */
details.exp{margin-top:14px}
details.exp>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--violet)}
details.exp>summary::-webkit-details-marker{display:none}
.plus{width:32px;height:32px;border-radius:10px;background:var(--violet);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;line-height:1;flex:none;box-shadow:0 3px 10px rgba(110,58,168,.35);transition:transform .25s}
details.exp>summary:hover .plus{transform:scale(1.08)}
details.exp[open]>summary .plus::after{content:"–"}
details.exp:not([open])>summary .plus::after{content:"+"}
details.exp .b{margin-top:12px;background:var(--lav);border-radius:12px;padding:16px 18px;font-size:13.5px;color:var(--ink-2)}
details.exp .b p+p{margin-top:9px}
.kpi details.exp>summary{position:absolute;top:16px;right:16px}
.kpi details.exp>summary .txt{display:none}
.panel.sig details.exp>summary{color:#C9A4F0}
.panel.sig .plus{background:var(--framboise);box-shadow:none}
.panel.sig details.exp .b{background:rgba(255,255,255,.07);color:#C4C0DE}

/* FUNNEL */
.fun{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;margin-top:14px;align-items:center}
.farrow{font-family:var(--disp);font-size:38px;font-weight:700;color:#C6C0D6;line-height:1;text-align:center;user-select:none}
.fstep{border-radius:14px;padding:18px}
.fstep.s1{background:var(--lav)}.fstep.s2{background:#EADFF8}.fstep.s3{background:#FBDDE4}
.fstep .st{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--violet)}
.fstep .n{font-family:var(--disp);font-size:42px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:8px}
.fstep .q{font-size:13px;color:var(--ink-2);margin-top:8px;min-height:52px}
.loss{margin-top:12px;background:rgba(255,255,255,.78);border-radius:10px;padding:12px}
.loss .lt{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rouge)}
.loss .ln{font-family:var(--disp);font-size:21px;font-weight:800;color:var(--rouge);letter-spacing:-.03em;margin-top:4px}
.loss .lx{font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* SENTIMENT */
.sdom{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;margin-top:16px;border-radius:16px;padding:20px 22px;background:linear-gradient(130deg,#12805F,#2FA37A 70%,#4FBE95)}
.sdom .semo{font-size:52px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.2))}
.sdom .sdv{font-family:var(--disp);font-size:56px;font-weight:800;letter-spacing:-.05em;line-height:1;color:#fff;margin-top:5px}
.sdom .sdv small{font-size:24px;margin-left:2px;color:rgba(255,255,255,.8)}
.sdom p{color:rgba(255,255,255,.88);font-size:13px;margin-top:7px;max-width:44ch}
.sbar{display:flex;height:52px;border-radius:14px;overflow:hidden;margin-top:12px;gap:3px}
.sbar i{display:flex;align-items:center;justify-content:center;height:100%;width:0;transition:width .9s cubic-bezier(.2,.8,.3,1);font-style:normal}
.sbar i span{font-size:20px;opacity:.95}
.sbar .s-pos{background:#2FA37A}
.sbar .s-neu{background:#7E8B99}
.sbar .s-mit{background:#E0922C}
.sbar .s-abs{background:#3E3A55}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.sgrid .s{border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;border:2px solid transparent}
.sgrid .e{font-size:28px;line-height:1}
.sgrid .t span{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase}
.sgrid .t b{display:block;font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.04em;margin-top:3px}
.sgrid .neu{background:#EFF1F3}.sgrid .neu .t span{color:#6B7783}.sgrid .neu .t b{color:#4A5560}
.sgrid .mit{background:#FCF0DD}.sgrid .mit .t span{color:#A8741E}.sgrid .mit .t b{color:#C77924}
.sgrid .neg{background:#F3FAF6;border-color:#2FA37A}.sgrid .neg .t span{color:#2C7E60}.sgrid .neg .t b{color:#2C7E60}
.sgrid .neg .e{filter:grayscale(1);opacity:.45}
.sgrid .abs{background:#EDEBF3}.sgrid .abs .t span{color:#6A6580}.sgrid .abs .t b{color:#3E3A55}

/* CONCURRENTS */
.cc{display:grid;grid-template-columns:96px 1fr 92px;gap:12px;align-items:center;padding:12px 0}
.cc+.cc{border-top:1px solid var(--line)}
.cc .n{font-family:var(--disp);font-size:16px;font-weight:700}
.cc .b{height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.cc .b i{display:block;height:100%;border-radius:6px;background:var(--violet);width:0;transition:width .9s cubic-bezier(.2,.8,.3,1)}
.cc.self .b i{background:var(--indigo)}
.cc.self .n{color:var(--indigo)}
.cc .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2)}

/* TABLES */
table{width:100%;border-collapse:collapse}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;padding:0 8px 10px;white-space:nowrap}
th:first-child{text-align:left}
td{padding:11px 8px;text-align:right;font-family:var(--mono);font-size:14px;border-top:1px solid var(--line);white-space:nowrap}
td:first-child{text-align:left;font-family:var(--sans)}
tr.tot td{border-top:2px solid var(--ink);font-weight:600}
tr.hi td{background:var(--lav)}
tr.hi td:first-child{font-weight:700;color:var(--violet)}
td.cn{background:#FBE7E6;color:var(--rouge);font-weight:600}
td.cp{background:#E4F3EC;color:var(--vert);font-weight:600}
.dim{color:var(--muted)}
.tblwrap{overflow-x:auto}

/* SOURCES */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filters button{font-size:13px;font-weight:600;background:var(--bg);border:1.5px solid var(--line);padding:8px 14px;border-radius:100px;cursor:pointer;color:var(--ink-2)}
.filters button:hover{border-color:var(--violet);color:var(--violet)}
.filters button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:#fff}
.srow{display:grid;grid-template-columns:26px 210px 1fr 104px;gap:12px;align-items:center;padding:10px 0}
.srow+.srow{border-top:1px solid var(--line)}
.srow .rk{font-family:var(--disp);font-size:16px;font-weight:800;color:var(--muted);text-align:center}
.srow .n{font-family:var(--mono);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .n em{font-style:normal;font-family:var(--sans);font-size:11px;color:var(--muted);display:block}
.srow .b{height:11px;background:var(--line);border-radius:6px;overflow:hidden}
.srow .b i{display:block;height:100%;border-radius:6px;background:var(--violet);width:0;transition:width .9s cubic-bezier(.2,.8,.3,1)}
.srow.pub .b i{background:var(--rouge)}.srow.pub .n{color:var(--rouge)}
.srow.own .b i{background:var(--indigo)}.srow.own .n{font-weight:700}
.srow .v{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2)}
.duel{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:16px}
.duel>div{border-radius:14px;padding:18px 20px}
.duel .own{background:linear-gradient(150deg,#EFEBFA,#F7F4FD)}
.duel .pub{background:linear-gradient(150deg,#FBE7E6,#FDF2F1)}
.duel .vs{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);padding:0}
.duel .v{font-family:var(--disp);font-size:52px;font-weight:800;letter-spacing:-.05em;line-height:1;margin-top:8px}
.duel .own .v{color:var(--indigo)}
.duel .pub .v{color:var(--rouge)}
.duel p{font-size:13px;color:var(--ink-2);margin-top:8px}
.duel p b{color:var(--ink);font-weight:600}
.duel .db{height:9px;background:rgba(20,18,31,.09);border-radius:5px;overflow:hidden;margin-top:12px}
.duel .db i{display:block;height:100%;border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.8,.3,1)}
.duel .own .db i{background:var(--indigo)}
.duel .pub .db i{background:var(--rouge)}
.duel-note{font-size:13.5px;color:var(--ink-2);margin-top:14px;max-width:88ch}
.stot{margin-top:14px;background:var(--bg);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--ink-2)}
.stot b{color:var(--ink);font-weight:600}

/* SIGNAUX */
.ctrl{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.seg{display:flex;background:rgba(255,255,255,.08);border-radius:100px;padding:4px}
.seg button{background:transparent;border:0;color:#A9A4C7;font-size:13px;font-weight:600;padding:8px 16px;border-radius:100px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:var(--indigo)}
.slid{display:flex;align-items:center;gap:12px;flex:1;min-width:280px}
.slid input{flex:1;accent-color:var(--framboise)}
.slid .rv{font-family:var(--disp);font-size:22px;font-weight:800;color:#fff;min-width:56px;text-align:right}
.fam{margin-top:18px;border-radius:20px;padding:20px;border:1px solid rgba(255,255,255,.09)}
.fam.int{background:linear-gradient(160deg,rgba(29,159,184,.12),rgba(255,255,255,.02))}
.fam.eco{background:linear-gradient(160deg,rgba(224,86,123,.12),rgba(255,255,255,.02))}
.fam-head{display:flex;align-items:center;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.fam-code{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-family:var(--disp);font-size:17px;font-weight:800;letter-spacing:.02em;color:#fff;flex:none}
.fam.int .fam-code{background:var(--cyan)}
.fam.eco .fam-code{background:var(--framboise)}
.fam-t{flex:1;min-width:240px}
.fam-t h3{font-size:20px;color:#fff}
.fam-t p{font-size:13px;color:#A9A4C7;margin-top:5px;max-width:70ch}
.fam-avg{text-align:right}
.fam-avg .lbl{display:block;margin-bottom:4px}
.fam-avg strong{font-family:var(--disp);font-size:34px;font-weight:800;letter-spacing:-.05em}
.fam.int .fam-avg strong{color:var(--cyan)}
.fam.eco .fam-avg strong{color:var(--framboise)}
.sigcode{position:absolute;top:16px;right:16px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;padding:5px 9px;border-radius:100px;font-weight:600}
.sigcard.int .sigcode{background:rgba(29,159,184,.22);color:#7FD9EA}
.sigcard.eco .sigcode{background:rgba(224,86,123,.22);color:#F5A3B8}
.sigcard{position:relative;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:var(--r);padding:20px}

.sigcard.eco{background:linear-gradient(160deg,rgba(224,86,123,.13),rgba(255,255,255,.03))}
.sigcard.int{background:linear-gradient(160deg,rgba(29,159,184,.13),rgba(255,255,255,.03))}
.sig-h{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.03em;color:#fff}
.sig-h h4{font-size:18px;color:#fff}
.sig-h .tagn{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#8B85B5;display:block;margin-top:3px}
.was{font-family:var(--mono);font-size:10px;color:#8B85B5;margin-top:4px;display:none}
.rebased .was{display:block}
.util{margin-top:14px;font-size:13.5px;color:#C4C0DE}
.util b{color:#fff;font-weight:600}
.todo{margin-top:14px;background:rgba(255,255,255,.09);border-radius:12px;padding:14px}
.todo .lt{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:#8B85B5}
.todo p{color:#fff;font-size:14px;font-weight:600;margin-top:7px}
.doms{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.dom{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.12);color:#EDEBF7;padding:5px 10px;border-radius:100px}

/* TERRITOIRE */
.terr-grid{display:grid;grid-template-columns:1.55fr 1fr;gap:14px;align-items:start}
.terr-side{display:grid;gap:14px}
.terr-card{background:#fff;border-radius:18px;padding:22px;border:2px solid transparent}
.terr-card.win{padding:30px;border-color:var(--violet);box-shadow:0 18px 44px rgba(110,58,168,.22);background:linear-gradient(160deg,#fff,#F6F1FD)}
.terr-card.win h3{font-size:30px;line-height:1.08;margin-top:14px}
.terr-card.out h3{font-size:18px;margin-top:10px;line-height:1.2}
.rank{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:6px 12px;border-radius:100px;display:inline-block}
.rank.no{background:#FBE7E6;color:var(--rouge)}
.rank.yes{background:var(--violet);color:#fff;font-size:11px;padding:7px 14px}
.rank.mid{background:#FCEEDA;color:var(--ambre)}
.who{font-size:12.5px;color:var(--muted);margin-top:6px;font-family:var(--mono)}
.crit{margin-top:16px}
.crit-row{display:grid;grid-template-columns:128px 1fr 40px;gap:10px;align-items:center;padding:6px 0}
.crit-row .k{font-size:12.5px;color:var(--ink-2)}
.crit-row .bar{height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.crit-row .bar i{display:block;height:100%;border-radius:5px;background:var(--violet);width:0;transition:width 1s cubic-bezier(.2,.8,.3,1)}
.crit-row.low .bar i{background:var(--rouge)}
.crit-row .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink-2)}
.just{margin-top:16px;font-size:14px;color:var(--ink-2);border-left:4px solid var(--violet);padding-left:14px}
.terr-card.out .just{border-left-color:var(--rouge);font-size:13px}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.proof div{background:var(--lav);border-radius:12px;padding:16px}
.proof .n{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:-.04em;color:var(--violet)}
.proof .t{font-size:12.5px;color:var(--ink-2);margin-top:6px}

/* PERSONAS */
.psel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.psel button{display:grid;grid-template-columns:auto 1fr auto;gap:13px;align-items:center;padding:16px;border:1.5px solid var(--line);border-radius:18px;background:rgba(255,255,255,.65);cursor:pointer;text-align:left;transition:180ms ease}
.psel button:hover{background:#fff}
.psel button[aria-pressed="true"]{border-color:var(--pc);background:#fff;box-shadow:0 10px 28px rgba(20,18,31,.09)}
.avatar{width:46px;height:46px;border-radius:15px;background:var(--pc);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:19px;font-weight:800}
.psel b{font-size:14px;display:block}
.psel small{display:block;margin-top:3px;color:var(--muted);font-size:11px;line-height:1.3}
.psel .abs{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--pc);letter-spacing:-.04em;text-align:right}
.psel .abs em{display:block;font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
.pfocus{display:block}
.pid{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border-radius:16px;padding:14px 18px;box-shadow:var(--sh)}
.pid .av{width:46px;height:46px;border-radius:14px;background:var(--pc);color:#fff;display:grid;place-items:center;font-family:var(--disp);font-size:20px;font-weight:800;flex:none}
.pid-t h3{font-size:21px;letter-spacing:-.03em;line-height:1}
.pid-t .role{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto}
.chips span{background:var(--bg);border-radius:100px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink);display:flex;align-items:baseline;gap:7px}
.chips em{font-style:normal;font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:400}
.pmain{background:#fff;border-radius:20px;padding:34px 38px;margin-top:12px;box-shadow:var(--sh);position:relative;overflow:hidden;text-align:center}
.pmain::before{content:"";position:absolute;left:-70px;top:-90px;width:240px;height:240px;border-radius:50%;background:color-mix(in srgb,var(--pc) 12%,transparent)}
.pmain::after{content:"";position:absolute;right:-80px;bottom:-100px;width:260px;height:260px;border-radius:50%;background:color-mix(in srgb,var(--pc) 10%,transparent)}
.startlbl{position:relative;z-index:1;display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;background:var(--pc);color:#fff;padding:6px 13px;border-radius:100px}
.pmain blockquote{position:relative;z-index:1;margin:20px auto 0;max-width:26ch;font-family:var(--disp);font-size:clamp(24px,3vw,40px);font-weight:700;line-height:1.12;letter-spacing:-.04em}
.pstats{display:flex;gap:12px;justify-content:center;margin-top:24px;position:relative;z-index:1;flex-wrap:wrap}
.pstats div{background:var(--bg);border-radius:14px;padding:14px 18px;min-width:190px;text-align:left}
.pstats strong{display:block;font-family:var(--disp);font-size:30px;font-weight:800;color:var(--pc);letter-spacing:-.04em}
.pstats span{display:block;margin-top:4px;color:var(--muted);font-size:11.5px;line-height:1.35;max-width:22ch}
.pcols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.pjourney{display:grid;gap:11px;align-content:start}
.jstep{padding:18px 20px;border-left:4px solid var(--pc);border-radius:0 14px 14px 0;background:#fff}
.jstep.danger{border-left-color:var(--rouge);background:#FBE7E6}
.jstep.opp{border-left-color:var(--vert);background:#E4F3EC}
.jstep span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.jstep p{margin-top:8px;font-size:13.5px;line-height:1.55}
.qlist{background:#fff;border-radius:16px;padding:20px;align-self:start}
.qlist>.lbl{display:block;margin-bottom:10px}
.qi{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;align-items:start}
.qi+.qi{border-top:1px solid var(--line)}
.qi .i{font-family:var(--mono);font-size:10px;color:var(--muted);padding-top:3px}
.qi .q{font-size:13px;color:var(--ink-2);line-height:1.4}
.qi .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:100px;display:inline-block;margin-top:6px}
.qi .s.ok{background:#E4F3EC;color:var(--vert)}
.qi .s.ko{background:#FBE7E6;color:var(--rouge)}
.qi .s.na{background:var(--bg);color:var(--muted);font-style:italic}
.qi.empty .q{color:var(--muted);font-style:italic}

/* ACTIONS */
.need{display:grid;grid-template-columns:1.35fr 1fr;gap:14px}
.steps{margin-top:10px}
.step{display:grid;grid-template-columns:30px 1fr;gap:14px;padding:13px 0}
.step+.step{border-top:1px solid var(--line)}
.step .i{width:28px;height:28px;border-radius:9px;background:var(--lav);color:var(--violet);font-family:var(--mono);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center}
.step h4{font-size:14.5px;font-family:var(--sans);font-weight:600}
.step p{font-size:13px;color:var(--ink-2);margin-top:3px}
.docs{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.doc{font-family:var(--mono);font-size:11px;background:var(--lav);color:var(--violet);padding:8px 12px;border-radius:100px}
.ns{background:linear-gradient(110deg,var(--indigo),#403084);color:#fff;border-radius:var(--r);padding:24px 26px;display:grid;grid-template-columns:1fr 1.2fr;gap:32px;align-items:center;margin-top:14px}
.ns h3{font-size:23px;margin-top:8px}
.ns .lbl{color:rgba(255,255,255,.55)}
.nspath{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.nspath span{font-family:var(--disp);font-size:19px;font-weight:800;color:rgba(255,255,255,.55)}
.nspath strong{font-family:var(--disp);font-size:19px;font-weight:800;color:#72E0BD}
.nspath i{height:8px;border-radius:6px;background:rgba(255,255,255,.14);overflow:hidden;display:block}
.nspath i b{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--framboise),#72E0BD);width:4%;transition:width .6s ease}
.prog{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:12px 16px;box-shadow:var(--sh)}
.dial{width:56px;height:56px;border-radius:50%;position:relative;display:grid;place-items:center;background:conic-gradient(var(--violet) var(--p,0deg),var(--line) 0);transition:background .4s ease;flex:none}
.dial::before{content:"";position:absolute;inset:6px;border-radius:50%;background:#fff}
.dial span{position:relative;font-family:var(--disp);font-size:13px;font-weight:800}
.prog .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.prog .v{font-family:var(--disp);font-size:16px;font-weight:800;margin-top:3px}
.chant{background:#fff;border-radius:var(--r);padding:20px;border-top:6px solid var(--st);position:relative}
.chant .top{display:flex;justify-content:space-between;align-items:center}
.chant .num{font-family:var(--disp);font-size:13px;font-weight:800;color:var(--st)}
.chant .hz{font-family:var(--mono);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--bg);padding:5px 9px;border-radius:100px}
.chant h3{font-size:18px;margin-top:12px}
.tgt{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:14px;padding:13px;border-radius:12px;background:color-mix(in srgb,var(--st) 8%,#fff);font-size:11.5px}
.tgt span{color:var(--ink-2)}
.tgt b{color:var(--muted)}
.tgt strong{color:var(--st);font-family:var(--disp);font-size:17px;text-align:right}
.acts{margin-top:14px}
.acts label{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.acts label:last-child{border-bottom:0}
.acts label.done{color:#A9A5B3;text-decoration:line-through}
.acts input{position:absolute;opacity:0;pointer-events:none}
.chk{width:22px;height:22px;border:1.5px solid #CFCAD8;border-radius:7px;display:grid;place-items:center;color:#fff;font-size:12px;background:#fff;transition:140ms ease;flex:none}
.acts label.done .chk{background:var(--st);border-color:var(--st)}
.sprog{height:6px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:14px}
.sprog i{display:block;height:100%;background:var(--st);border-radius:5px;width:0;transition:width .35s ease}
.chant .cnt{display:block;margin-top:8px;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}
.foot{padding:26px 0 0;font-size:12px;color:var(--muted);max-width:100ch}

@media (max-width:1140px){.g4{grid-template-columns:repeat(2,1fr)}.hero,.need,.terr-grid,.pcols{grid-template-columns:1fr}}
@media (max-width:820px){
  .g2,.g3,.g4,.fun,.proof,.psel,.ns,.duel{grid-template-columns:1fr}
  .sgrid{grid-template-columns:1fr 1fr}
  .farrow{transform:rotate(90deg);font-size:28px}
  .score-card{grid-template-columns:1fr}
  .srow{grid-template-columns:24px 1fr}.srow .b,.srow .v{grid-column:2}
  .pstats{flex-direction:column}
  .chips{margin-left:0}
}
:focus-visible{outline:3px solid var(--framboise);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


/* ══ NOTE STRATÉGIQUE ══ */

.notewrap{display:grid;grid-template-columns:250px 1fr;gap:24px;align-items:start}
.notenav{position:sticky;top:96px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:16px}
.notenav .lbl{display:block;margin-bottom:12px}
.notenav a{display:block;padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:none;line-height:1.35}
.notenav a:hover{background:var(--lav);color:var(--violet)}
.notenav a.lev{padding-left:22px;font-size:12.5px;color:var(--muted);font-weight:500}
.notebody{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:44px clamp(24px,4vw,60px)}
.notehero{border-bottom:1px solid var(--line);padding-bottom:26px;margin-bottom:10px}
.notehero .k{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
.notehero h2{font-size:clamp(30px,4vw,46px);letter-spacing:-.04em;margin-top:12px;line-height:1.05}
.notehero .sub{font-size:17px;color:var(--ink-2);margin-top:12px;max-width:60ch}
.notehero .meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:16px}
.notebody h3{font-size:clamp(21px,2.4vw,28px);letter-spacing:-.03em;margin-top:44px;color:var(--indigo)}
.notebody h4{font-size:20px;letter-spacing:-.02em;margin-top:38px;color:var(--violet)}
.notebody .prio{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--framboise);display:block;margin-top:6px;font-weight:600}
.notebody p{font-size:15.5px;line-height:1.72;color:var(--ink-2);margin-top:15px;max-width:78ch}
.notebody p b{color:var(--ink);font-weight:600}
.notebody p.lead{font-size:17px;color:var(--ink)}
.levcard{background:var(--lav);border-radius:16px;padding:6px 24px 22px;margin-top:24px;border-left:5px solid var(--violet)}
.levcard h4{margin-top:22px}
.levcard p{max-width:72ch}
.noteget{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:var(--bg);border-radius:14px;padding:14px 18px;margin-top:30px}
.noteget p{margin:0;font-size:13.5px;flex:1;min-width:220px}
@media (max-width:980px){.notewrap{grid-template-columns:1fr}.notenav{position:static}}
@page{size:A4 landscape;margin:9mm}
@media print{
  body{background:#fff;font-size:8.6pt}
  .sticky{position:static;background:#fff;box-shadow:none;border-bottom:1px solid #000}
  .tab{color:#000;min-height:0;padding:8px}
  .btn-pdf,.filters,.ctrl,.engines,.decision button{display:none}
  .panel{display:block!important;padding:12px 0;break-before:page}
  .panel:first-of-type{break-before:auto}
  .panel.sig{background:#fff;color:#000}
  .panel.sig .zhead .desc,.util,.sig-h .tagn{color:#333!important}
  .sigcard{background:#fff!important;border:1px solid #ccc}
  .sig-h h4,.util b,.ring span,.todo p{color:#000!important}
  .todo{background:#F1EDFA!important}.dom{background:#eee;color:#000}
  .hscore .t,.hscore .big{color:#000!important}
  .hscore .d,.hscore .big i{color:#555!important}
  details.exp>summary{display:none}
  details.exp .b{display:block!important}
  .card,.pq,.terr-card,.chant,.sigcard,.score-card,.fstep,.decision,.qlist,.jstep,.levcard{break-inside:avoid;box-shadow:none}
  .notenav,.noteget{display:none}
  .notewrap{grid-template-columns:1fr}
  .notebody{padding:0;box-shadow:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

.fam-src{padding:16px 0}
.fam-src+.fam-src{border-top:1px solid var(--line)}
.fs-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fs-n{font-size:15px;font-weight:700}
.fs-c{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.fs-p{margin-left:auto;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.03em}
.fam-src.pri .fs-p{color:var(--rouge)}
.fam-src.own .fs-p{color:var(--indigo)}
.fam-src.conc .fs-p{color:var(--muted)}
.fam-src.zero .fs-p{color:var(--ambre)}
.fs-b{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.fs-b i{display:block;height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.3,1);background:var(--violet)}
.fam-src.pri .fs-b i{background:var(--rouge)}
.fam-src.own .fs-b i{background:var(--indigo)}
.fam-src.conc .fs-b i{background:var(--muted)}
.fam-src.zero .fs-b i{background:var(--ambre)}
.fs-d{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.fs-d span{font-family:var(--mono);font-size:11px;background:var(--bg);color:var(--ink-2);padding:5px 10px;border-radius:100px}
.fam-src.zero .fs-d span{opacity:.62;text-decoration:line-through}
.fs-e{font-size:13px;color:var(--ink-2);margin-top:10px;max-width:76ch}

/* ── familles de sources ── */
.fam-src{padding:16px 0}
.fam-src+.fam-src{border-top:1px solid var(--line)}
.fs-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.fs-n{font-size:15px;font-weight:700}
.fs-c{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fs-p{margin-left:auto;font-family:var(--disp);font-size:22px;font-weight:800;letter-spacing:-.03em}
.fam-src.own .fs-p{color:var(--indigo)}.fam-src.pri .fs-p{color:var(--violet)}
.fam-src.conc .fs-p{color:var(--muted)}.fam-src.zero .fs-p{color:var(--rouge)}
.fs-b{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:10px}
.fs-b i{display:block;height:100%;border-radius:6px;width:0;transition:width .9s cubic-bezier(.2,.8,.3,1);background:var(--violet)}
.fam-src.own .fs-b i{background:var(--indigo)}.fam-src.conc .fs-b i{background:var(--muted)}
.fam-src.zero .fs-b i{background:var(--rouge)}
.fs-d{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.fs-d span{font-family:var(--mono);font-size:11px;background:var(--bg);color:var(--ink-2);padding:5px 10px;border-radius:100px}
.fam-src.zero .fs-d span{opacity:.6}
.fs-e{font-size:13px;color:var(--ink-2);margin-top:10px;max-width:78ch}

/* ── axes ── */
.axe{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:22px 24px;margin-bottom:12px;border-left:6px solid var(--xc)}
.ax-h{display:flex;gap:16px;align-items:flex-start}
.ax-n{font-family:var(--disp);font-size:30px;font-weight:800;letter-spacing:-.05em;color:var(--xc);line-height:1;flex:none;min-width:42px}
.ax-h h3{font-size:20px;letter-spacing:-.02em;line-height:1.2}
.ax-m{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.ax-m span{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;padding:5px 10px;border-radius:100px;font-weight:600}
.ax-p.haute{background:#FBE7E6;color:#B3322D}
.ax-p.moyenne{background:#FCF0DD;color:#8A6318}
.ax-p.longue{background:var(--bg);color:var(--muted)}
.ax-s.new{background:var(--lav);color:var(--violet)}
.ax-s.revu{background:#E6F5F9;color:#15748A}
.ax-s.deck{background:var(--bg);color:var(--muted)}
.ax-h2{background:rgba(20,18,31,.05);color:var(--ink-2)}
.ax-w{font-size:13.5px;color:var(--ink-2);margin-top:14px;padding-left:14px;border-left:3px solid var(--xc);line-height:1.6}
.ax-w b{color:var(--ink)}
.ax-g{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.ax-g>div{background:var(--bg);border-radius:12px;padding:13px 15px}
.ax-g span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--xc);font-weight:600}
.ax-g ul{margin:9px 0 0;padding:0;list-style:none}
.ax-g li{font-size:12.5px;color:var(--ink-2);line-height:1.5;padding-left:13px;position:relative;margin-top:7px}
.ax-g li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--xc)}
.ax-sig{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.ax-sig span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
 background:var(--xc);color:#fff;padding:5px 11px;border-radius:100px;opacity:.9}
@media (max-width:900px){.ax-g{grid-template-columns:1fr}}

/* ── porte-paroles ── */
.pp{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:24px;margin-bottom:12px;border-left:6px solid var(--pc)}
.pp-h{display:flex;gap:16px;align-items:flex-start}
.pp-av{width:52px;height:52px;border-radius:16px;background:var(--pc);color:#fff;display:grid;place-items:center;
 font-family:var(--disp);font-size:19px;font-weight:800;flex:none}
.pp-id h3{font-size:20px;letter-spacing:-.02em}
.pp-f{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.pp-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.pp-tags span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:100px;font-weight:600}
.pp-t{background:var(--pc);color:#fff}
.pp-v{background:var(--bg);color:var(--ink-2)}
.pp-v.très-forte{background:#E4F3EC;color:var(--vert)}
.pp-v.forte{background:var(--lav);color:var(--violet)}
.pp-s{background:#FBE7E6;color:var(--rouge)}
.pp-e{font-size:13.5px;color:var(--ink-2);margin-top:16px}
.pp-e b{color:var(--ink)}
.pp-w{font-size:13.5px;color:var(--ink-2);margin-top:11px;padding-left:14px;border-left:3px solid var(--pc);line-height:1.6;max-width:88ch}
.pp-cols{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:16px}
.pp-cols>div{background:var(--bg);border-radius:12px;padding:14px 16px}
.pp-cols ul{margin:10px 0 0;padding:0;list-style:none}
.pp-cols li{font-size:12.5px;color:var(--ink-2);line-height:1.5;padding-left:14px;position:relative;margin-top:8px}
.pp-cols li::before{content:"";position:absolute;left:0;top:7px;width:5px;height:5px;border-radius:50%;background:var(--pc)}
.pp-terr{background:color-mix(in srgb,var(--pc) 9%,#fff)!important}
.pp-terr p{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.5}
@media (max-width:900px){.pp-cols{grid-template-columns:1fr}}

.hm2{width:100%;border-collapse:separate;border-spacing:3px}
.hm2 th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
 font-weight:500;padding:0 6px 9px;text-align:center}
.hm2 th:first-child{text-align:left}
.hm2 td{padding:10px 6px;text-align:center;font-family:var(--mono);font-size:13px;border-radius:5px;color:#fff;font-weight:700}
.hm2 td:first-child{text-align:left;background:transparent!important;color:var(--ink);font-family:var(--sans);
 font-size:13.5px;font-weight:600;padding-left:0}
.hm2 td:first-child em{display:block;font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;
 text-transform:uppercase;color:var(--muted);margin-top:3px}
.hm2 td.moy{background:var(--bg)!important;color:var(--ink)!important;font-weight:800}
.hm2 tr.fam-ec td:first-child{color:#B33A62}
.hm2 tr.fam-in td:first-child{color:#1D7A8F}

.ptag{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
 color:#fff;padding:4px 9px;border-radius:100px;vertical-align:middle;font-weight:600;margin-left:4px}

/* méthode · signaux en détail */
.sigd{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:22px 24px;margin-bottom:12px;border-left:6px solid var(--sc2)}
.sigd.int{--sc2:#1D9FB8;--sb2:#E6F5F9}
.sigd.eco{--sc2:#E0567B;--sb2:#FBE7F0}
.sd-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.sd-n{font-family:var(--disp);font-size:26px;font-weight:800;letter-spacing:-.05em;color:var(--sc2);min-width:36px}
.sd-h h3{font-size:20px;letter-spacing:-.02em}
.sd-q{font-size:13.5px;color:var(--ink-2);margin-top:3px;font-style:italic}
.sd-f{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;
 background:var(--sb2);color:var(--sc2);padding:5px 11px;border-radius:100px;font-weight:600}
.sd-d{font-size:13.5px;color:var(--ink-2);margin-top:13px;line-height:1.65;max-width:88ch}
.sd-g{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-top:15px}
.sd-g>div{border-radius:12px;padding:13px 15px;background:var(--bg)}
.sd-g .up{background:#E9F5EF}.sd-g .down{background:#FBEAE9}
.sd-g span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.sd-g .up span{color:var(--vert)}.sd-g .down span{color:var(--rouge)}
.sd-g p{font-size:12.5px;color:var(--ink-2);margin-top:8px;line-height:1.55}
.sd-vs{font-size:13px;color:var(--ink);margin-top:14px;padding:12px 15px;background:var(--sb2);border-radius:11px}
.sd-vs b{color:var(--sc2)}
@media (max-width:900px){.sd-g{grid-template-columns:1fr}}


/* méthode · calcul */
.calc{display:flex;flex-wrap:wrap;gap:18px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:20px 22px;margin-bottom:10px}
.calc>*{min-width:0;max-width:100%}
.calc>*:not(.cl){flex:1 1 320px}
.presets button{max-width:100%;white-space:normal;text-align:left}
.calc .cl{width:44px;height:44px;border-radius:14px;background:var(--indigo);color:#fff;display:grid;place-items:center;
 font-family:var(--disp);font-size:20px;font-weight:800;flex:none}
.calc h3{font-size:18px;letter-spacing:-.02em}
.calc p{font-size:13.5px;color:var(--ink-2);margin-top:9px;line-height:1.65;max-width:86ch}
.calc .cex{font-family:var(--mono);font-size:11.5px;color:var(--violet);background:var(--lav);
 padding:9px 13px;border-radius:9px;margin-top:11px;display:inline-block}


/* onglet Méthode : registre distinct des onglets de résultats */
.nav .tab.meth{margin-left:auto;color:rgba(255,255,255,.55);background:rgba(255,255,255,.07);
 border-radius:12px 12px 0 0;position:relative}
.nav .tab.meth .n{background:rgba(255,255,255,.16);color:rgba(255,255,255,.75)}
.nav .tab.meth:hover{color:#fff;background:rgba(255,255,255,.13)}
.nav .tab.meth[aria-selected="true"]{background:#EDEBF7;color:var(--indigo)}
.nav .tab.meth[aria-selected="true"] .n{background:var(--violet);color:#fff}
.nav .tab.meth[aria-selected="true"]::after{background:var(--violet)}

.mixnote{margin-top:16px;background:#FCF0DD;border-radius:12px;padding:14px 16px;font-size:12.5px;
 color:#6B4C12;line-height:1.6}
.mixnote b{color:#8A6318}
#p-meth{background:linear-gradient(180deg,#F6F4FC,#FBFAFE)}
#p-meth .zhead h2{color:var(--indigo)}

.qnote{font-size:12px;color:var(--muted);line-height:1.55;margin:8px 0 12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.qi.docq{background:#FBE7E6;border-radius:11px;padding:12px;margin:6px -6px}
.qcite{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.qcite span{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--rouge);
 width:100%;font-weight:600;margin-bottom:2px}
.qcite i{font-style:normal;font-family:var(--mono);font-size:10.5px;background:#fff;color:var(--ink-2);
 padding:4px 9px;border-radius:100px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qflag{margin-left:auto;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
 background:#FCF0DD;color:#8A6318;padding:5px 10px;border-radius:100px;font-weight:600}
.psel .abs{font-family:var(--disp);font-size:22px;font-weight:800;color:var(--pc);letter-spacing:-.04em;text-align:right}


/* ══════ TABLES DE MÉTHODE ══════ */
.ftbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.ftbl td,.ftbl th{overflow-wrap:break-word}
.ftbl th{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-align:left;padding:0 12px 9px;border-bottom:1px solid var(--line);font-weight:600;vertical-align:bottom;white-space:normal}
.ftbl td{padding:11px 12px;border-bottom:1px solid var(--line);color:var(--ink-2);vertical-align:top;white-space:normal;text-align:left;font-family:var(--sans);font-size:13px;border-top:0}
.ftbl tr:last-child td{border-bottom:0}
.ftbl td:first-child{color:var(--ink);font-weight:600}
.ftbl td b{color:var(--ink)}
.ftbl .mono{font-family:var(--mono);font-size:11.5px;color:var(--violet)}
.ftbl .num{font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:right}
.ftbl.auto{table-layout:auto}
.fscroll{overflow-x:auto}

/* ══════ ATTENTE DE DONNÉES ══════ */
.wait{background:repeating-linear-gradient(135deg,#FFF,#FFF 14px,#FBFAFE 14px,#FBFAFE 28px);border:1px dashed var(--line);border-radius:var(--r);padding:30px}
.wait .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--framboise);background:#FBE7F0;border-radius:100px;padding:5px 11px;display:inline-block}
.wait h3{font-size:22px;margin-top:14px}
.wait p{font-size:13.5px;color:var(--ink-2);margin-top:9px;max-width:72ch}
.need-list{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:18px}
.need-list div{background:#fff;border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);border:1px solid var(--line)}
.need-list div span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}

/* ══════ MOTEURS PONDÉRÉS ══════ */
.eng{display:grid;grid-template-columns:120px 1fr 54px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.eng:last-child{border-bottom:0}
.eng .n{font-size:13.5px;font-weight:600}
.eng .t{height:9px;border-radius:9px;background:#EFEDF6;overflow:hidden}
.eng .t i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--indigo),var(--violet));transition:width .9s cubic-bezier(.2,.8,.3,1)}
.eng .v{font-family:var(--mono);font-size:13px;text-align:right;color:var(--ink)}

/* ══════ CALCULETTE ══════ */
.calcwrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cbox{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;border-top:4px solid var(--violet)}
.cbox.sol{border-top-color:var(--muted)}
.cbox h4{font-size:16px}
.cbox .sb{font-size:12.5px;color:var(--muted);margin-top:5px}
.crow{display:grid;grid-template-columns:1fr 92px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crow label{font-size:13px;color:var(--ink-2)}
.crow label small{display:block;color:var(--muted);font-size:11px}
.crow input{width:100%;font-family:var(--mono);font-size:13px;padding:7px 9px;border:1px solid var(--line);border-radius:9px;text-align:right;background:var(--bg);color:var(--ink)}
.crow input:focus{outline:2px solid var(--violet);outline-offset:1px}
.cres{margin-top:14px;background:var(--lav);border-radius:12px;padding:12px 14px}
.cres div{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;font-size:13px;color:var(--ink-2)}
.cres div b{font-family:var(--mono);font-size:14px;color:var(--indigo)}
.cres div.big{border-top:1px solid #E0D9F2;margin-top:5px;padding-top:9px}
.cres div.big b{font-family:var(--disp);font-size:21px;font-weight:800;letter-spacing:-.03em}
.glob{background:linear-gradient(150deg,var(--indigo),var(--indigo-2) 60%,#5A2E86);color:#fff;border-radius:var(--r);padding:24px;margin-top:14px;display:grid;grid-template-columns:1fr 240px;gap:24px;align-items:center}
.glob .ttl{font-family:var(--disp);font-size:19px;font-weight:700}
.glob .fx{font-family:var(--mono);font-size:12.5px;color:#C9C1EC;margin-top:10px;line-height:1.7}
.glob .fx b{color:#fff}
.glob .big{font-family:var(--disp);font-size:68px;font-weight:800;letter-spacing:-.05em;line-height:.9;text-align:right}
.glob .big i{font-style:normal;font-size:16px;color:#A79FD4}
.glob .pal{text-align:right;margin-top:8px}
.glob .pal span{background:var(--framboise);border-radius:100px;padding:5px 12px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase}
.alt{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.alt div{background:#fff;border-radius:12px;padding:14px;box-shadow:var(--sh);border-left:4px solid var(--line)}
.alt div.on{border-left-color:var(--framboise)}
.alt .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.alt .v{font-family:var(--disp);font-size:27px;font-weight:800;letter-spacing:-.04em;color:var(--indigo);margin-top:6px}
.alt p{font-size:12px;color:var(--ink-2);margin-top:6px}

/* ══════ ÉTAPES ══════ */
.stp{display:grid;grid-template-columns:46px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp .i{width:40px;height:40px;border-radius:12px;background:var(--indigo);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:14px;font-weight:600}
.stp h4{font-size:16.5px}
.stp p{font-size:13.5px;color:var(--ink-2);margin-top:7px;max-width:76ch}
.stp .fx{font-family:var(--mono);font-size:12.5px;background:var(--bg);border-radius:10px;padding:10px 13px;margin-top:10px;color:var(--indigo);display:inline-block}
.stp .ex{font-size:12.5px;color:var(--muted);margin-top:8px}
.stp .ex b{color:var(--ink-2)}

/* ══════ PARAMÈTRES VERROUILLÉS ══════ */
.lock{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.lk{background:#fff;border-radius:14px;box-shadow:var(--sh);padding:18px;border-left:4px solid var(--ambre)}
.lk .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ambre)}
.lk h4{font-size:16px;margin-top:8px}
.lk .val{font-family:var(--mono);font-size:13px;color:var(--indigo);background:var(--bg);border-radius:9px;padding:8px 11px;margin-top:10px;display:inline-block}
.lk p{font-size:12.5px;color:var(--ink-2);margin-top:10px}

/* ══════ SIGNAUX ══════ */
.sfam{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.sf{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:20px;border-top:4px solid var(--cyan)}
.sf.eco{border-top-color:var(--framboise)}
.sf .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.sf.eco .k{color:var(--framboise)}
.sf h4{font-size:18px;margin-top:8px}
.sf>p{font-size:13px;color:var(--ink-2);margin-top:8px}
.sl{padding:12px 0;border-top:1px solid var(--line);margin-top:12px}
.sl b{font-size:14px}
.sl p{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.sf .rule{background:var(--bg);border-radius:11px;padding:12px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}

D.STEPS=[
 ["0","Tag every answer","Each answer is filed into one of the two sub-sets, spontaneous or prompted, according to whether the question names the brand.","","On this diagnostic: 30 questions name the brand, 30 do not."],
 ["1","Count presence","A citation is worth 0.7, a simple mention 0.3, an absence 0. A citation is a link to the official domain.","Presence = (cited share × 0.7) + (mentioned share × 0.3)","Spontaneous: 26.1 × 0.7 + 5 × 0.3 = 19.8. Prompted: 100 × 0.7 + 0 × 0.3 = 70."],
 ["2","Rebase quality","The six signals and the sentiment are only scored where the brand appears, then brought back to the total of the sub-set.","Rebased quality = present quality × (cited share + mentioned share)","Spontaneous: factor 0.311, quality 67.1, so rebased 20.9. Prompted: factor 1.00, quality 68.1 unchanged."],
 ["3","Compose the sub-set","Presence weighs three times more than quality.","Score = 0.75 × presence + 0.25 × rebased quality","Spontaneous: 0.75 × 19.8 + 0.25 × 20.9 = 20.0. Prompted: 0.75 × 70 + 0.25 × 68.1 = 69.5."],
 ["4","Compose the headline score","The spontaneous reading carries 85 % of the score, the prompted one 15 %.","Overall = 0.85 × spontaneous + 0.15 × prompted","0.85 × 20.0 + 0.15 × 69.5 = 27.4, rounded to 27, Developing tier."],
 ["5","Label the prompted reading","The prompted reading never comes out as the headline score.","","It stands here at 70, Established tier. That is brand hygiene information, not authority."]];

 ["Parameter B","The composite of a sub-set","0.75 × presence + 0.25 × rebased quality","Presence is the condition of existence, quality a modifier. Spontaneously, 19.8 of presence and 20.9 of quality give 20."],

D.INSIGHTS=[
 ["Fünfzig Punkte zwischen den beiden Lesarten","20 spontan gegen 70 gestützt. Die Marke existiert, wenn sie genannt wird, und löst sich in der Kategorie auf, wenn sie es nicht wird. Das ist kein Bekanntheitsproblem, es ist ein Quellenproblem: das Modell hat keinen Grund, auf korian.de zu verlinken."],
 ["Volumen ist nicht Autorität","Korian führt jedes Territorium bei der Häufigkeit des Auftretens an und hält dabei nur 22,3 % der zitierten Quellen. Beim Volumen zu führen und die Antwort zu besitzen sind zwei verschiedene Dinge, und nur das zweite übersteht einen Wettbewerber, der ordentlich veröffentlicht."],
 ["Die realen Wettbewerber sind nicht die vorab definierten","Auf dem Territorium, auf dem Familien beginnen, dem Erkennen, wann ein Angehöriger Pflege braucht, liegt Alloheim bei null, und Caritas und Diakonie tragen die Antwort. Vertrauen fließt in diesem Markt über Beratungsstellen und gemeinnützige Träger, nicht über Betreiber."]];

D.STEPS=[
 ["0","Jede Antwort markieren","Jede Antwort wird einer der beiden Teilmengen zugeordnet, spontan oder gestützt, je nachdem, ob die Frage die Marke nennt.","","In dieser Diagnose: 30 Fragen nennen die Marke, 30 nicht."],
 ["1","Präsenz zählen","Eine Zitation ist 0,7 wert, eine einfache Erwähnung 0,3, eine Abwesenheit 0. Eine Zitation ist ein Link auf die offizielle Domain.","Präsenz = (zitierter Anteil × 0,7) + (erwähnter Anteil × 0,3)","Spontan: 26,1 × 0,7 + 5 × 0,3 = 19,8. Gestützt: 100 × 0,7 + 0 × 0,3 = 70."],
 ["2","Qualität zurückführen","Die sechs Signale und die Tonalität werden nur dort bewertet, wo die Marke erscheint, und dann auf das Gesamtvolumen der Teilmenge zurückgeführt.","Zurückgeführte Qualität = Qualität bei Präsenz × (zitierter Anteil + erwähnter Anteil)","Spontan: Faktor 0,311, Qualität 67,1, also zurückgeführt 20,9. Gestützt: Faktor 1,00, Qualität 68,1 unverändert."],
 ["3","Die Teilmenge zusammensetzen","Präsenz wiegt dreimal mehr als Qualität.","Score = 0,75 × Präsenz + 0,25 × zurückgeführte Qualität","Spontan: 0,75 × 19,8 + 0,25 × 20,9 = 20,0. Gestützt: 0,75 × 70 + 0,25 × 68,1 = 69,5."],
 ["4","Den Gesamtscore zusammensetzen","Die spontane Lesart trägt 85 % des Scores, die gestützte 15 %.","Gesamt = 0,85 × spontan + 0,15 × gestützt","0,85 × 20,0 + 0,15 × 69,5 = 27,4, gerundet auf 27, Stufe In Entwicklung."],
 ["5","Die gestützte Lesart einordnen","Die gestützte Lesart kommt nie als Gesamtscore heraus.","","Sie steht hier bei 70, Stufe Etabliert. Das ist eine Information zur Markenhygiene, nicht zur Autorität."]];

D.LOCKS=[
 ["Parameter A","Das Gewicht der Präsenzzustände","Zitiert = 0,7 · Erwähnung = 0,3 · Abwesend = 0","Eine Zitation mit Link macht die Marke zur Quelle, eine Erwähnung macht sie zur Erinnerung. Die Spanne von 0,7 zu 0,3 ist die gewählte Abwägung, überall angewandt."],
 ["Parameter B","Die Zusammensetzung einer Teilmenge","0,75 × Präsenz + 0,25 × zurückgeführte Qualität","Präsenz ist die Existenzbedingung, Qualität ein Modifikator. Spontan ergeben 19,8 Präsenz und 20,9 Qualität den Wert 20."],
 ["Parameter C","Der Umfang der Autorität","Autorität wird auf der spontanen Lesart gemessen","Das ist der Umfang, der über eine Auswahlliste entscheidet. Hier steht er bei 20, fünfzig Punkte unter der gestützten Lesart."],
 ["Parameter D","Der Gesamtscore","0,85 × spontan + 0,15 × gestützt","Die gestützte Lesart bei 70 hebt den Score nur um sieben Punkte über die spontane Lesart allein."]];

D.RESERVES=[
 ["Präsenzquote: 64 % oder 31,1 %","Die Zusammenfassung der Diagnose zeigt 64 % spontane Präsenz. Die Aufschlüsselung nach Zustand ergibt eine andere Zahl: 26,1 % vollständige Zitationen plus 5 % einfache Erwähnungen, also 31,1 %, genau der Wert, den die Marktkartierung für Korian ausweist. Das Dashboard arbeitet mit der Aufschlüsselung nach Zustand, weil sie in die Berechnung eingeht und den Score von 27 reproduziert."],
 ["Vollständige Zitation: 25 % oder 26,1 %","Die Zusammenfassung zeigt 25 %, die spontane Aufschlüsselung 26,1 % und die gestützte 100 %. Keine dieser drei Zahlen lässt sich auf einer Basis von 360 Gesprächen aus den beiden anderen ableiten. Das Aggregat der Zusammenfassung sollte vom Messteam explizit gemacht werden."],
 ["Das Benchmark verfehlt die realen Wettbewerber","Drei Wettbewerber wurden vorab definiert. Die Marktkartierung setzt Caritas auf Platz drei und Diakonie auf Platz vier, vor Kursana, das vorab definiert war. Auf dem Territorium des Pflegeeinstiegs liegt Alloheim bei null. Die Ranking-Tabelle vergleicht Korian daher mit Akteuren, die nicht jene sind, denen Familien begegnen."],
 ["Rohnoten der Signale werden nicht veröffentlicht","Die drei internen Signale werden vor dem Eingang in den Score von Hand gegen das Beobachtbare korrigiert. Diese Fassung der Diagnose veröffentlicht die korrigierten Noten, 50, 65 und 97, ohne die Rohnoten aus dem Tool. Der Umfang dieser Korrektur ist auf diesem Dokument daher nicht überprüfbar."]];

const palOf=v=>v<25?[T.pal0,"#E0567B"]:v<50?[T.pal1,"#C77924"]:v<75?[T.pal2,"#1D9FB8"]:[T.pal3,"#2C7E60"];
function sub(p){
  const c=+Q(p+'_c').value||0,m=+Q(p+'_m').value||0,q=+Q(p+'_q').value||0;
  const pres=c*.7+m*.3, fac=Math.min(1,(c+m)/100), qreb=q*fac, sc2=.75*pres+.25*qreb;
  Q(p+'_r').innerHTML=`<div><span>${E(T.calcPres)}</span><b>${fr(pres)}</b></div>
   <div><span>${E(T.calcFac)}</span><b>${fr(fac,3)}</b></div>
   <div><span>${E(T.calcQreb)}</span><b>${fr(qreb)}</b></div>
   <div class="big"><span>${E(T.calcSub)}</span><b>${fr(sc2)}</b></div>`;
  return sc2;
}
function calc(){
  const sp=sub('sp'),so=sub('so');
  const g=.85*sp+.15*so, r=Math.round(g), p=palOf(r);
  Q('globV').innerHTML=`${r}<i>/100</i>`;
  Q('globP').textContent=p[0]; Q('globP').style.background=p[1];
  Q('globFx').innerHTML=`${fr(.85,2)} × <b>${fr(sp)}</b> &nbsp;+&nbsp; ${fr(.15,2)} × <b>${fr(so)}</b> &nbsp;=&nbsp; <b>${fr(g)}</b><br>${E(T.calcFx)}`;
  Q('altW').innerHTML=D.ALTS.map((a,i)=>{const v=Math.round(a[0]*sp+a[1]*so),pp=palOf(v);
    return `<div class="${i===0?'on':''}"><div class="k">${E(a[2])}</div><div class="v">${v}<span style="font-size:14px;color:var(--muted)">/100</span></div>
      <p><b style="color:${pp[1]}">${pp[0]}</b> · ${E(a[3])}</p></div>`}).join('');
}

function num(el,v){const t0=performance.now();
  (function s(n){const k=Math.min((n-t0)/1100,1),x=(1-Math.pow(1-k,3))*v;
   el.textContent=(v%1?x.toFixed(1).replace('.',DEC):mil(Math.round(x)));
   if(k<1)requestAnimationFrame(s)})(performance.now());}
function anim(scope){
  scope.querySelectorAll('[data-count]').forEach(el=>num(el,+el.dataset.count));
  scope.querySelectorAll('[data-w]').forEach((el,i)=>{el.style.width='0';setTimeout(()=>el.style.width=Math.max(.8,+el.dataset.w)+'%',60+Math.min(i,20)*45)});
  if(scope.id==='p-synth')gauge();
}
function gauge(){const arc=Q('gArc'),n=Q('gNum'),C=477.5,t0=performance.now();
  (function s(t){const k=Math.min((t-t0)/1700,1),v=(1-Math.pow(1-k,3))*A.score;
   arc.style.strokeDashoffset=(C-(C*v/100)).toFixed(1);n.textContent=Math.round(v);
   if(k<1)requestAnimationFrame(s)})(performance.now());}
anim(Q('p-act'));
num(Q('hsNum'),A.score);

window.addEventListener('beforeprint',()=>{
  document.querySelectorAll('.panel').forEach(p=>{p.style.animation='none';p.style.opacity='1';p.style.transform='none'});
  document.querySelectorAll('[data-count]').forEach(el=>{el.textContent=(+el.dataset.count%1?fr(+el.dataset.count):mil(Math.round(+el.dataset.count)))});
  document.querySelectorAll('[data-w]').forEach(el=>{el.style.transition='none';el.style.width=Math.max(.8,+el.dataset.w)+'%'});
  const arc=Q('gArc');if(arc){arc.style.transition='none';arc.style.strokeDashoffset=(477.5-(477.5*A.score/100)).toFixed(1);Q('gNum').textContent=A.score}
  Q('hsNum').textContent=A.score;
});

</script>
</body></html>
